# Example base configuration (.unirtm.toml)
# In UniRTM, environment-specific overrides are placed in dedicated overlay files:
#   .unirtm.<env>.toml (e.g., .unirtm.development.toml, .unirtm.ci.toml, .unirtm.production.toml)
#
# Load order and precedence:
#   1. Global config (~/.config/unirtm/unirtm.toml)
#   2. Project base config (.unirtm.toml)
#   3. Environment overlay (.unirtm.<env>.toml, activated via -E <env> or UNIRTM_ENV=<env>)
#   4. Local private override (.unirtm.local.toml)

[tools]
node = { version = "20.0.0" }
python = { version = "3.11.0" }
go = { version = "1.21.0" }

[env]
NODE_ENV = "production"
LOG_LEVEL = "info"
DATABASE_URL = "postgres://prod-db:5432/myapp"

[settings]
cache_dir = "/var/cache/unirtm"
cache_ttl = 86400               # 24 hours
jobs = 16

[tasks.build]
description = "Build for production"
run = "npm run build"

[tasks.deploy]
description = "Deploy to production"
run = "kubectl apply -f k8s/production/"
