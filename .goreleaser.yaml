---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
project_name: unirtm

report_sizes: true

gomod:
  proxy: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

git:
  ignore_tags:
    - nightly
    - "*-nightly"

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Generate shell completion scripts dynamically before building packages
    - go run ./main.go completion -d ./completions --all
    # Generate manpages
    - go run ./main.go generate manpage -d ./manpages

builds:
  - id: unirtm
    binary: unirtm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X 'github.com/snowdreamtech/unirtm/internal/pkg/env.ProjectName=unirtm'
      - -X 'github.com/snowdreamtech/unirtm/internal/pkg/env.Author=Snowdream Tech <snowdreamtech@qq.com>'
      - -X github.com/snowdreamtech/unirtm/internal/pkg/env.BuildTime={{.Date}}
      - -X github.com/snowdreamtech/unirtm/internal/pkg/env.CommitHash={{.ShortCommit}}
      - -X github.com/snowdreamtech/unirtm/internal/pkg/env.CommitHashFull={{.FullCommit}}
      - -X github.com/snowdreamtech/unirtm/internal/pkg/env.GitTag={{.Tag}}
      - -X 'github.com/snowdreamtech/unirtm/internal/pkg/env.COPYRIGHT=Copyright (c) 2023-present SnowdreamTech Inc.'
      - -X 'github.com/snowdreamtech/unirtm/internal/pkg/env.LICENSE=MIT <https://github.com/snowdreamtech/unirtm/blob/main/LICENSE>'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - loong64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - "7"
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - id: unirtm
    formats: [tar.gz]
    # This name template makes the OS and Arch compatible with uname and includes the version.
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # Wraps the files inside a top-level directory within the archive to prevent tarbombing (Best Practice)
    wrap_in_directory: true
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    # Use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    # Include all relevant standard documentation arrays using Globs
    files:
      - src: "LICENSE*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "README*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "CHANGELOG*"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "completions/*"
        dst: "completions"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: "manpages/*"
        dst: "manpages"
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

checksum:
  name_template: "checksums.txt"

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  github:
    owner: snowdreamtech
    name: UniRTM
  header: |
    **UniRTM** (Uni Runtime and Tools Manager) is a cross-platform developer toolchain manager inspired by [mise](https://github.com/jdx/mise).

    It manages runtimes, tools, and tasks across Linux, macOS, and Windows — while serving as the **Single Source of Truth** for AI agent rules, workflows, and project configurations across 50+ AI-assisted IDEs (Cursor, Windsurf, GitHub Copilot, Gemini, Claude, Cline, and more).

    **Key capabilities:**
    - 📦 Manage runtimes & tools (Go, Node.js, Python, Rust, and more) with version pinning
    - 🤖 Unified rule engine for 50+ AI-assisted IDEs via a single `.agent/rules/` directory
    - 🔁 Smart SpecKit workflows (`speckit.plan`, `speckit.analyze`, `speckit.implement`)
    - 🛡️ Triple-guarantee quality gates: IDE → pre-commit → GitHub Actions CI/CD
    - 🌐 Cross-platform: Linux (Debian/Alpine/RHEL), macOS, Windows

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "(?i)^test"
      - "(?i)^ci"
      - "(?i)^build"
      - "(?i)^style"
      - "(?i)^revert"
      - "^Merge pull request"
      - "^Merge remote-tracking branch"
      - "^Merge branch"
      - "merge conflict"
  groups:
    - title: "🚀 Features"
      regexp: "^.*(?i)feat[(\\w)]*:+.*$"
      order: 100
    - title: "🐛 Bug Fixes"
      regexp: "^.*(?i)fix[(\\w)]*:+.*$"
      order: 200
    - title: "⚡️ Performance Improvements"
      regexp: "^.*(?i)perf[(\\w)]*:+.*$"
      order: 300
    - title: "🛠 Refactoring"
      regexp: "^.*(?i)refactor[(\\w)]*:+.*$"
      order: 400
    - title: "🛡️ Security Updates"
      regexp: "^.*(?i)(sec|security)[(\\w)]*:+.*$"
      order: 600
    - title: "📖 Documentation"
      regexp: "^.*(?i)docs[(\\w)]*:+.*$"
      order: 700
    - title: "♻️ Miscellaneous Chores"
      order: 9999

nfpms:
  - id: default
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://github.com/snowdreamtech/unirtm
    maintainer: "Snowdream Tech <snowdreamtech@qq.com>"
    description: |-
      UniRTM (Uni Runtime and Tools Manager) is a cross-platform developer toolchain manager.
      It manages runtimes, tools, and tasks across Linux, macOS, and Windows.
    license: MIT
    vendor: SnowdreamTech
    bindir: /usr/bin
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    contents:
      - src: ./completions/unirtm.bash
        dst: /usr/share/bash-completion/completions/unirtm
        file_info:
          mode: 0644
      - src: ./completions/unirtm.zsh
        dst: /usr/share/zsh/vendor-completions/_unirtm
        file_info:
          mode: 0644
      - src: ./completions/unirtm.fish
        dst: /usr/share/fish/vendor_completions.d/unirtm.fish
        file_info:
          mode: 0644
      - src: ./manpages/*
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644

snapcrafts:
  - name_template: "{{ .ProjectName }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    summary: UniRTM (Uni Runtime and Tools Manager)
    description: |
      UniRTM manages runtimes, tools, and tasks across Linux, macOS, and Windows.
    grade: stable
    confinement: classic
    publish: false

flatpak:
  - app_id: com.snowdreamtech.UniRTM
    runtime: org.freedesktop.Platform
    runtime_version: "24.08"
    sdk: org.freedesktop.Sdk
    finish_args:
      - --share=network
      - --filesystem=host

universal_binaries:
  - replace: false

sboms:
  # Generate SBOMs for all release artifacts: archives (tar.gz/zip) and Linux packages (deb/rpm/apk/archlinux)
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    output: '{{ not (isEnvSet "CI") }}'
    artifacts: checksum
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes # Enables keyless signing via OIDC token

homebrew_casks:
  - name: unirtm
    binaries:
      - unirtm
    manpages:
      - manpages/unirtm.1
    completions:
      bash: completions/unirtm.bash
      zsh: completions/unirtm.zsh
      fish: completions/unirtm.fish
    repository:
      owner: snowdreamtech
      name: homebrew-tap
    homepage: "https://github.com/snowdreamtech/UniRTM"
    description: "UniRTM (Uni Runtime and Tools Manager) is a cross-platform developer toolchain manager."
    license: "MIT"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/unirtm"]
          end
